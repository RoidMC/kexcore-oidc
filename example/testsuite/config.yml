# OIDC Conformance Test Suite Configuration
# Used by test.py to automate conformance testing via the OIDF conformance suite API.
# See: https://gitlab.com/openid/conformance-suite/-/wikis/Design/BrowserControl

# Shared variables — referenced via ${VAR} in this file
vars:
  suite_url: "https://192.168.2.167:8443"
  issuer_url: "https://192.168.2.133:9998"
  issuer_host: "192.168.2.133"

# OIDC Conformance Suite
# Official: https://www.certification.openid.net (requires token from /tokens.html)
# Self-hosted: https://localhost:8443 (no token needed)
suite:
  url: "${suite_url}"
  # Get token from: https://www.certification.openid.net/tokens.html
  # Or set env var: OIDF_CONFORMANCE_TOKEN
  token: ""
  # Set to false for self-hosted suites with self-signed certificates
  verify_ssl: false
  rotate_key_endpoint:
    url: "/admin/rotate-keys"
    method: "POST"

plan_config:
  alias: "kexcore-test"
  description: "StormEngine SDK conformance testing"
  server:
    discoveryUrl: "${issuer_url}/.well-known/openid-configuration"
    allow_unexpected_metadata_fields:
      - "resource_indicators_supported"
      - "backchannel_logout_endpoint"
  client:
    client_id: "Test Client 1"
    client_secret: "test-secret-1"
  client_secret_post:
    client_id: "Test Client 1"
    client_secret: "test-secret-1"
  # Resource endpoint for FAPI tests (RFC 8707 resource indicator)
  # The conformance suite uses this URL to verify access tokens by calling the resource.
  resource:
    resourceUrl: "${issuer_url}/userinfo"
  client2:
    client_id: "Test Client 2"
    client_secret: "test-secret-2"
  mtls:
    ca: "../storm-server/cert/ca.crt"
    cert: "../storm-server/cert/client.crt"
    key: "../storm-server/cert/client.key"
  mtls2:
    ca: "../storm-server/cert/ca.crt"
    cert: "../storm-server/cert/client.crt" 
    key: "../storm-server/cert/client.key"
  # FAPI client (private_key_jwt authentication)
  # Private key (d): D0elCuLKMTS5M1Q1K-lhmfMiUjoDv-L-HPQz_Z9WY2Q
  # Must match the key registered in main.go mustParseFAPIKey()
  fapi_client: &fapi_client
    client_id: "FAPI Client 1"
    client_secret: ""
    scope: "openid profile"
    token_endpoint_auth_method: "private_key_jwt"
    jwks:
      keys:
        - kty: "EC"
          use: "sig"
          kid: "fapi-test-key-1"
          alg: "ES256"
          crv: "P-256"
          x: "-VA0fzoJpkWmuwRWilmc8xSrlrPVmAzlpMpQMiZetVc"
          y: "sWwU5hohNPTkEuyCeVYWySYuU9a-dPkBeoAApG8UTpk"
          d: "D0elCuLKMTS5M1Q1K-lhmfMiUjoDv-L-HPQz_Z9WY2Q"
  # FAPI second client (for user-rejects-authentication test)
  fapi_client2: &fapi_client2
    client_id: "FAPI Client 2"
    scope: "openid profile"
    client_secret: ""
    token_endpoint_auth_method: "private_key_jwt"
    jwks:
      keys:
        - kty: "EC"
          use: "sig"
          kid: "fapi-test-key-2"
          alg: "ES256"
          crv: "P-256"
          x: "0YCniv9r1v7a95GbMZzxtz3w09clH7QhhKi65A2KvLw"
          y: "rG_x865khWLke14qOmogZlnSvJzvQ5yvxXdT0ySqjtw"
          d: "rurglw6JTgh3Ijy-UiNQCPswBYsnxrnDRyP1Xde39lc"
  # Plain OAuth variants (no openid scope, for openid: "plain_oauth" tests)
  fapi_client_oauth: &fapi_client_oauth
    <<: *fapi_client
    scope: "profile"
  fapi_client2_oauth: &fapi_client2_oauth
    <<: *fapi_client2
    scope: "profile"
  # publish: "summary"  # uncomment to publish results to certification.openid.net

  # Browser automation — controls the conformance suite's built-in Selenium
  browser:
    - match: "${issuer_url}/authorize*"
      tasks:
        - task: "Login"
          optional: true
          match: "${issuer_url}/login*"
          commands:
            - ["text", "name", "username", "test-user@${issuer_host}"]
            - ["text", "name", "password", "verysecure"]
            - ["click", "css", "button[type='submit']"]
        - task: "Authorize callback"
          optional: true
          match: "${issuer_url}/authorize/callback*"
          commands: []
        - task: "Verify complete"
          match: "*/test/*/callback*"
          commands:
            - ["wait", "id", "submission_complete", 30]
    # Logout flow — server does immediate redirect (no confirmation page)
    - match: "${issuer_url}/end_session*"
      tasks:
        - task: "Logged out"
          optional: true
          match: "${issuer_url}/end_session*"
          commands:
            - [
                "wait",
                "xpath",
                "//*",
                30,
                "Logged Out",
                "update-image-placeholder",
              ]

  # Per-test browser overrides (for negative / special tests)
  override:
    oidcc-response-type-missing:
      browser:
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "Verify error"
              match: "${issuer_url}/error*"
              commands:
                - [
                    "wait",
                    "xpath",
                    "//*",
                    30,
                    "Error",
                    "update-image-placeholder",
                  ]
    oidcc-ensure-registered-redirect-uri:
      browser:
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "Verify error"
              match: "${issuer_url}/error*"
              commands:
                - [
                    "wait",
                    "xpath",
                    "//*",
                    30,
                    "Error",
                    "update-image-placeholder",
                  ]
    oidcc-prompt-none-not-logged-in:
      browser:
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "Verify login_required"
              match: "*/test/*/callback*"
              commands:
                - ["wait", "id", "submission_complete", 30]
    oidcc-rp-initiated-logout-no-id-token-hint:
      browser:
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "Login"
              optional: true
              match: "${issuer_url}/login*"
              commands:
                - ["text", "name", "username", "test-user@${issuer_host}"]
                - ["text", "name", "password", "verysecure"]
                - ["click", "css", "button[type='submit']"]
            - task: "Verify complete"
              match: "*/test/*/callback*"
              commands:
                - ["wait", "id", "submission_complete", 30]
        - match: "${issuer_url}/end_session*"
          tasks:
            - task: "Logged out"
              match: "${issuer_url}/end_session*"
              commands:
                - [
                    "wait",
                    "xpath",
                    "//*",
                    30,
                    "Logged Out",
                    "update-image-placeholder",
                  ]
    oidcc-rp-initiated-logout-bad-post-logout-redirect-uri:
      browser:
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "Login"
              optional: true
              match: "${issuer_url}/login*"
              commands:
                - ["text", "name", "username", "test-user@${issuer_host}"]
                - ["text", "name", "password", "verysecure"]
                - ["click", "css", "button[type='submit']"]
            - task: "Verify complete"
              match: "*/test/*/callback*"
              commands:
                - ["wait", "id", "submission_complete", 30]
        - match: "${issuer_url}/end_session*"
          tasks:
            - task: "Expect error"
              match: "${issuer_url}/end_session*"
              commands:
                - [
                    "wait",
                    "xpath",
                    "//*",
                    30,
                    "Invalid post_logout_redirect_uri",
                    "update-image-placeholder",
                  ]
    oidcc-rp-initiated-logout-modified-id-token-hint:
      browser:
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "Login"
              optional: true
              match: "${issuer_url}/login*"
              commands:
                - ["text", "name", "username", "test-user@${issuer_host}"]
                - ["text", "name", "password", "verysecure"]
                - ["click", "css", "button[type='submit']"]
            - task: "Verify complete"
              match: "*/test/*/callback*"
              commands:
                - ["wait", "id", "submission_complete", 30]
        - match: "${issuer_url}/end_session*"
          tasks:
            - task: "Expect error"
              match: "${issuer_url}/end_session*"
              commands:
                - [
                    "wait",
                    "xpath",
                    "//*",
                    30,
                    "Invalid",
                    "update-image-placeholder",
                  ]
    # Backchannel logout: end_session redirects to post_logout_redirect_uri
    oidcc-backchannel-rp-initiated-logout:
      browser:
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "Login"
              optional: true
              match: "${issuer_url}/login*"
              commands:
                - ["text", "name", "username", "test-user@${issuer_host}"]
                - ["text", "name", "password", "verysecure"]
                - ["click", "css", "button[type='submit']"]
            - task: "Authorize callback"
              optional: true
              match: "${issuer_url}/authorize/callback*"
              commands: []
            - task: "Verify complete"
              match: "*/test/*/callback*"
              commands:
                - ["wait", "id", "submission_complete", 30]
        - match: "${issuer_url}/end_session*"
          tasks:
            - task: "Verify post-logout redirect"
              match: "*/test/*/post_logout_redirect*"

    # FAPI user-rejects-authentication: click Cancel instead of Login
    fapi2-security-profile-final-user-rejects-authentication:
      browser:
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "Cancel login"
              optional: true
              match: "${issuer_url}/login*"
              commands:
                - ["click", "css", "button[formaction='/login/cancel']"]
            - task: "Verify access_denied"
              match: "*/test/*/callback*"
              commands:
                - ["wait", "id", "submission_complete", 30]

    # FAPI PAR request_uri reuse: first visit must NOT log in; second visit logs in
    fapi2-security-profile-final-par-ensure-reused-request-uri-prior-to-auth-completion-succeeds:
      browser:
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "First visit - no login"
              optional: true
              match: "${issuer_url}/login*"
              commands: []
        - match: "${issuer_url}/authorize*"
          tasks:
            - task: "Second visit - login"
              optional: true
              match: "${issuer_url}/login*"
              commands:
                - ["text", "name", "username", "test-user@${issuer_host}"]
                - ["text", "name", "password", "verysecure"]
                - ["click", "css", "button[type='submit']"]
            - task: "Verify complete"
              match: "*/test/*/callback*"
              commands:
                - ["wait", "id", "submission_complete", 30]

# Test plans — group by category for selective runs
# because of requires image upload
skip_modules:
  # oidcc-dynamic-certification-test-plan
  - "oidcc-ensure-redirect-uri-in-authorization-request"
  - "oidcc-redirect-uri-query-mismatch"
  - "oidcc-redirect-uri-query-added"
  - "oidcc-registration-logo-uri"
  - "oidcc-registration-policy-uri"
  - "oidcc-registration-tos-uri"
  # oidcc-basic-certification-test-plan
  - "oidcc-response-type-missing"
  - "oidcc-prompt-login"
  - "oidcc-display-page"
  - "oidcc-display-popup"
  - "oidcc-prompt-consent"
  - "oidcc-max-age-1"
  - "oidcc-ensure-registered-redirect-uri"
  # oidcc-dynamic-certification-test-plan
  # oidcc-server-rotate-keys: automated via rotate_key_endpoint hook
  # oidcc-rp-initiated-logout-certification-test-plan
  - "oidcc-rp-initiated-logout-modified-id-token-hint"
  - "oidcc-rp-initiated-logout-no-id-token-hint"
  - "oidcc-rp-initiated-logout-no-params"
  - "oidcc-rp-initiated-logout-no-post-logout-redirect-uri"
  - "oidcc-rp-initiated-logout-only-state"
  - "oidcc-rp-initiated-logout-query-added-to-post-logout-redirect-uri"
  - "oidcc-rp-initiated-logout-bad-id-token-hint"
  # fapi2
  - "fapi2-security-profile-final-ensure-different-nonce-inside-and-outside-request-object"
  - "fapi2-security-profile-final-ensure-different-state-inside-and-outside-request-object"
  - "fapi2-security-profile-final-ensure-authorization-request-with-long-nonce"
  - "fapi2-security-profile-final-par-attempt-to-use-request_uri-for-different-client"
  - "fapi2-security-profile-final-par-attempt-to-use-expired-request_uri"
  - "fapi2-security-profile-final-par-ensure-reused-request-uri-prior-to-auth-completion-succeeds"
