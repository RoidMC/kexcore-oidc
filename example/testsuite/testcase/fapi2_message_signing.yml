# FAPI2 Message Signing — signed request object variants
fapi2_message_signing:
    - planName: "fapi2-message-signing-final-test-plan"
      testcase:
        private_key_jwt_oauth:
          client: *fapi_client_ms_oauth
          client2: *fapi_client2_ms_oauth
          variant:
            client_auth_type: "private_key_jwt"
            fapi_profile: "plain_fapi"
            fapi_request_method: "signed_non_repudiation"
            fapi_response_mode_range:
              - "jarm"
              - "plain_response"
            sender_constrain_range:
              - "dpop"
              - "mtls"
            openid: "plain_oauth"
        private_key_jwt:
          client: *fapi_client_ms
          client2: *fapi_client2_ms
          variant:
            client_auth_type: "private_key_jwt"
            fapi_profile: "plain_fapi"
            fapi_request_method: "signed_non_repudiation"
            fapi_response_mode_range:
              - "jarm"
              - "plain_response"
            sender_constrain_range: 
              - "dpop"  
              - "mtls"
            openid: "openid_connect"
        # --- mTLS client-auth variants ---
        # sender_constrain=dpop and =mtls must use different client
        # registrations: a single client cannot be both DPoP-only-bound and
        # certificate-bound, so sharing it makes the negative holder-of-key
        # and DPoP tests accept the wrong proof.
        mtls_dpop_oauth:
          client: *fapi_client_ms_mtls_dpop_oauth
          client2: *fapi_client2_ms_mtls_dpop_oauth
          variant:
            client_auth_type: "mtls"
            fapi_profile: "plain_fapi"
            fapi_request_method: "signed_non_repudiation"
            fapi_response_mode_range:
              - "plain_response"
              - "jarm"
            sender_constrain: "dpop"
            openid: "plain_oauth"
        mtls_dpop:
          client: *fapi_client_ms_mtls_dpop
          client2: *fapi_client2_ms_mtls_dpop
          variant:
            client_auth_type: "mtls"
            fapi_profile: "plain_fapi"
            fapi_request_method: "signed_non_repudiation"
            fapi_response_mode_range:
              - "plain_response"
              - "jarm"
            sender_constrain: "dpop"
            openid: "openid_connect"
        mtls_mtls_oauth:
          client: *fapi_client_ms_mtls_oauth
          client2: *fapi_client2_ms_mtls_oauth
          variant:
            client_auth_type: "mtls"
            fapi_profile: "plain_fapi"
            fapi_request_method: "signed_non_repudiation"
            fapi_response_mode_range:
              - "plain_response"
              - "jarm"
            sender_constrain: "mtls"
            openid: "plain_oauth"
        mtls_mtls:
          client: *fapi_client_ms_mtls
          client2: *fapi_client2_ms_mtls
          variant:
            client_auth_type: "mtls"
            fapi_profile: "plain_fapi"
            fapi_request_method: "signed_non_repudiation"
            fapi_response_mode_range:
              - "plain_response"
              - "jarm"
            sender_constrain: "mtls"
            openid: "openid_connect"
