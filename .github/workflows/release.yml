name: Release
on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27.3']
    name: Go ${{ matrix.go }} test
    steps:
      - uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        env:
          GOEXPERIMENT: jsonv2
        run: go test -race -v -coverprofile=profile.cov -coverpkg=./pkg/... ./pkg/...
      - uses: codecov/codecov-action@v6.0.0
        with:
          files: ./profile.cov
          name: codecov-go
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          args: --timeout=5m
  release:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: ${{ contains(github.event.head_commit.message, '[ci:release]') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next') }}
    env:
      GITHUB_TOKEN: ${{ secrets.KEX_GITHUB_TOKEN }}
    steps:
    - name: Source checkout
      uses: actions/checkout@v6
    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@v6
      with:
        dry_run: false
        semantic_version: 25.0.9
        extra_plugins: |
          @semantic-release/exec@6.0.3
          conventional-changelog-conventionalcommits@8.0.0
