name: 📄 Documentation
description: Report missing, outdated or incorrect documentation.
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched the existing issues and documentation.
          required: true
  - type: input
    id: location
    attributes:
      label: Page or file
      description: Link or repository path of the affected document.
      placeholder: docs/plugins.md §3.2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong?
      description: Quote the current text and explain what is incorrect or absent.
      placeholder: The current text says ..., but ...
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional. Concrete replacement text is much appreciated.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
