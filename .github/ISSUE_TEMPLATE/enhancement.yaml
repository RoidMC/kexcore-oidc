name: 🛠️ Improvement
description: Propose a feature or improvement for the KexCore OIDC SDK.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose an improvement.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched the existing issues and documentation.
          required: true
        - label: This is not a security issue (see SECURITY.md instead).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or painful today?
      placeholder: As a [type of user], I want [some goal] so that [some reason].
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the expected behaviour, configuration and public API.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Proposed plugin category
      description: Only relevant when this adds an OIDC endpoint or protocol behaviour.
      options:
        - Not a plugin / not applicable
        - Core (always on, cannot be disabled)
        - Standard (registered by default, can be disabled)
        - Optional (opt-in via Enable)
  - type: input
    id: spec
    attributes:
      label: Related specification
      description: RFC or OIDC specification section this implements, if any.
      placeholder: RFC 9126 (Pushed Authorization Requests)
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you have evaluated.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
