name: 🐛 Bug Report
description: Report a reproducible defect in the KexCore OIDC SDK.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. A minimal reproduction
        (engine options + request + expected/actual) is the fastest path to a fix.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched the existing issues and documentation.
          required: true
        - label: I can reproduce this on the latest release.
          required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      description: Output of `go list -m github.com/roidmc/kexcore-oidc/v3`, or the version of the app embedding it.
      placeholder: v3.4.0
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
      placeholder: go1.27.4 windows/amd64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Plugin assembly / categories
        - Built-in plugin (authorization, token, keys, userinfo, ...)
        - Discovery / metadata
        - Storage adapter
        - Example server
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: What happened?
      description: Describe the observed behaviour and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code, engine options and the HTTP request(s) involved.
      placeholder: |
        1. Build an engine with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: As a [type of user], I expected [some result] so that [some reason].
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      description: Redact secrets, tokens and internal issuer URLs if needed.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Related issues, workarounds or anything else that might help.
